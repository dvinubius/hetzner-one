name: caddy

services:
  caddy:
    # GitHub Actions builds the Dockerfile and publishes it to GHCR. On the VPS,
    # deployment writes compose.override.yaml, which Compose merges
    # automatically, to pin this service to the verified image digest. This
    # tag is only the local test build, and the image of host-built installs
    # that predate GHCR.
    image: caddy-hooklook:2.11.4-ratelimit
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/art-gallery/public:/srv/art-gallery:ro
      # External so no Compose command in any project can remove TLS state.
      # Copied from the historical zibs_caddy-* volumes on migration.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - zibs-edge
      - hooklook-edge
      - saga-lab-edge
      - platform-metrics

volumes:
  caddy-data:
    external: true
    name: caddy_caddy-data
  caddy-config:
    external: true
    name: caddy_caddy-config

networks:
  # Shared ingress networks are owned here; applications join externally.
  zibs-edge:
    name: zibs-edge
  # This project owns the shared ingress network. Hooklook only joins it as an
  # external consumer, so it cannot accidentally create an isolated network.
  hooklook-edge:
    name: hooklook-edge
  # Saga Lab joins externally, with its app and Grafana under unique aliases.
  saga-lab-edge:
    name: saga-lab-edge
  # Also declared by compose.observability.yaml under the same project/key.
  platform-metrics:
    internal: true
