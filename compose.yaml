name: caddy

services:
  caddy:
    # A distinct custom-image tag leaves the prior official image untouched as
    # a safe rollback reference until the candidate has been verified.
    image: caddy-hooklook:2.11.4-ratelimit
    build:
      context: .
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/art-gallery/public:/srv/art-gallery:ro
      # These are the existing zibs-owned volume names. Keeping them external
      # retains the live ACME certificates and Caddy runtime state on cutover.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - zibs-edge
      - hooklook-edge

volumes:
  caddy-data:
    external: true
    name: zibs_caddy-data
  caddy-config:
    external: true
    name: zibs_caddy-config

networks:
  # Shared ingress networks are owned here; applications join externally.
  zibs-edge:
    name: zibs-edge
  # This project owns the shared ingress network. Hooklook only joins it as an
  # external consumer, so it cannot accidentally create an isolated network.
  hooklook-edge:
    name: hooklook-edge
